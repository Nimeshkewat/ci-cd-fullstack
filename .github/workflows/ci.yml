name: Full Stack CI

on:
  push:
    branches:
      - main

jobs:
  client:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run client lint
        working-directory: client
        run: npm run lint

      - name: Build client
        working-directory: client
        run: npm run build

  server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run server lint
        working-directory: server
        run: npm run lint

      - name: Build server
        working-directory: server
        run: npm run build
